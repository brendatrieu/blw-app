name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/brendatrieu/blw-app

jobs:
  build-and-deploy:
    name: Build image and deploy to the VM
    # Native arm64 runner (free for public repos) — emulated builds of this
    # workspace exceed the 6h job timeout under QEMU.
    runs-on: ubuntu-24.04-arm
    # Deploys are opt-in: flip the DEPLOY_ENABLED repo/environment variable
    # to "true" once the Oracle VM is provisioned and reachable. Until
    # then, pushes to main build nothing here (CI still runs separately).
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/blw
            docker compose pull app
            docker compose up -d --wait
